# The master behind Caddy, which gets the certificate and terminates TLS.
# install.sh (README.md, "Installing") sets it up in /opt/opence-master;
# by hand:
#
#   echo MASTER_DOMAIN=master1.example.org > .env
#   echo MASTER_PUBLIC_URL=https://master1.example.org > master.env
#   docker compose up -d
#   docker compose logs master    # the setup link: open it to name the master
#
# Images are pinned by digest, and each release's signed SHA256SUMS covers this
# file. To move to a new image, change the digest here (or take a new release).
# The master makes its key at its first start (back up the master-data
# volume), and updates itself: the admin pages, or the bot's notice in the
# applications channel. To run an image built from this checkout instead,
# tag it and put that tag on the image line below:
# docker build -t ghcr.io/opencommunityedition/opence-master-server:latest .
#
# The master believes X-Forwarded-For and X-Forwarded-Proto only from the
# compose network's addresses (MASTER_TRUSTED_PROXIES), where Caddy is (or,
# with compose.proxy.yaml for a reverse proxy of your own, the network's
# gateway, through which the proxy's requests come).
services:
  master:
    image: ghcr.io/opencommunityedition/opence-master-server@sha256:788d79a74a612a2251a8054893696de577e94c69c927ddcce050cc13ae2250f4
    restart: unless-stopped
    env_file: master.env
    environment:
      MASTER_TRUSTED_PROXIES: 172.30.90.0/24
    volumes:
      - master-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [master]

  caddy:
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    restart: unless-stopped
    environment:
      MASTER_DOMAIN: ${MASTER_DOMAIN:?set MASTER_DOMAIN to the master's domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [master]
    networks: [master]

networks:
  master:
    ipam:
      config:
        - subnet: 172.30.90.0/24

volumes:
  master-data:
  caddy-data:
  caddy-config:
